<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        @page {
            size: letter portrait;
            margin: 0.45in;
        }

        body {
            font-family: "Times New Roman", serif;
            font-size: 11pt;
            color: #14213d;
            margin: 0;
        }

        .sheet {
            margin-top: 100px;
            width: 100%;
        }

        .student-heading {
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .spacer {
            height: 14px;
        }

        .letter-block-table {
            font-family: Tahoma, Helvetica, Arial;
            width: 100%;
            border-collapse: collapse;
        }

        .letter-block-table td {
            padding: 0;
            vertical-align: top;
        }

        .letter-indent {
            width: .70in;
        }

        .body-line {
            margin: 0 0 4px 0;
        }

        .grades-table {
            border: 2px solid black;
            border-radius: 15px;           /* Adjust this value as needed */
            width: 100%;
            border-collapse: separate;     /* REQUIRED for border-radius */
            border-spacing: 0;             /* Removes unwanted gaps */
            overflow: hidden;              /* Helps rounded corners display cleanly */
            margin-bottom: 18px;
        }

        .summary-table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 8px;
            margin-left: 2in;
            font-size: 9pt;
        }

        /* Keep your existing cell styling */
        .grades-table th,
        .grades-table td {
            border: 1px solid black;
            padding: 6px 7px;
        }
        .summary-table th,
        .summary-table td {
            padding: 2px 2px;
        }

        .grades-table th,
        .summary-table th {
            text-align: left;
            font-size: 9pt;
        }
        .summary-table tr.footer {
            font-weight: bold;
        }

        .grades-table td {
            text-align: center;
        }

        .grades-table td.course-cell {
            text-align: left;
            width: 42%;
        }

        .teacher-name {
            display: block;
            font-size: 9pt;
            color: #526173;
            margin-top: 2px;
        }
    </style>
</head>
<body>
<div class="sheet">

    <table class="letter-block-table">
        <tr>
            <td class="letter-indent"></td>
            <td>
                <div class="student-heading">
                    <span th:text="${student.lname()}">Last</span>,
                    <span th:text="${student.fname()}">First</span>
                    <span> - Grade </span>
                    <span th:text="${gradeDisplay}">8</span>
                </div>
            </td>

        </tr>
        <tr>
            <td class="letter-indent"></td>
            <td>
                <p class="body-line">
                    Quarter <span th:text="${#strings.substring(selectedTerm, 1)}">3</span> - Report Card.
                </p>
                <div class="spacer"></div>
                <p class="body-line">Grades closed on May 22, 2026.</p>
                <p class="body-line">SY<span th:text="${schoolYearLabel}">2025-2026</span>.</p>
                <div class="spacer"></div>
                <p class="body-line">To the Parents/Guardians of:</p>
                <p class="body-line" th:text="${studentName}">Student Name</p>
                <p class="body-line" th:text="${legacyContact != null && legacyContact.mailingAddressSingleLine() != null ? legacyContact.mailingAddressSingleLine() : '-'}">Address</p>
                <div class="spacer"></div>
            </td>
        </tr>
    </table>

    <table class="grades-table">
        <thead>
        <tr>
            <th>Course</th>
            <th>Teacher</th>
            <th th:each="termOption : ${reportCard.visibleTerms}" colspan="2" th:text="${termOption}">Q1</th>
        </tr>
        <tr>
            <th></th>
            <th></th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q1')}">Grade</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q1')}">Cit</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q2')}">Grade</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q2')}">Cit</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q3')}">Grade</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q3')}">Cit</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q4')}">Grade</th>
            <th th:if="${#lists.contains(reportCard.visibleTerms, 'Q4')}">Cit</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="courseRow : ${reportCard.courses}">
            <td class="course-cell" th:text="${courseRow.courseName}">Course </td>
            <td class="course-cell" th:text="${courseRow.teacherName}">Teacher</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q1')}" th:text="${courseRow.q1GradeDisplay()}">95</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q1')}" th:text="${courseRow.q1CitizenshipDisplay()}">E</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q2')}" th:text="${courseRow.q2GradeDisplay()}">95</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q2')}" th:text="${courseRow.q2CitizenshipDisplay()}">E</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q3')}" th:text="${courseRow.q3GradeDisplay()}">95</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q3')}" th:text="${courseRow.q3CitizenshipDisplay()}">E</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q4')}" th:text="${courseRow.q4GradeDisplay()}">95</td>
            <td th:if="${#lists.contains(reportCard.visibleTerms, 'Q4')}" th:text="${courseRow.q4CitizenshipDisplay()}">E</td>
        </tr>
        </tbody>
    </table>

    <table class="summary-table">
        <thead>
        <tr>
            <th>Term</th>
            <th>GPA</th>
            <th>Numeric Average</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="summary : ${reportCard.quarterSummaries}">
            <td th:text="${summary.label()}">Q1</td>
            <td th:text="${summary.gpaDisplay()}">4.00</td>
            <td th:text="${summary.numericAverageDisplay()}">95.00</td>
        </tr>
<!--        <tr class="footer" th:if="${#lists.contains(reportCard.visibleTerms, 'Q4')}">-->
<!--            <td th:text="${reportCard.overallSummary.label()}">Overall</td>-->
<!--            <td></td>-->
<!--            <td th:text="${reportCard.overallSummary.numericAverageDisplay()}">95.00</td>-->
<!--        </tr>-->
        </tbody>
    </table>
</div>
</body>
</html>
