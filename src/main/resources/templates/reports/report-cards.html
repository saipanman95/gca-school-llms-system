<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report Cards | GCA School MS</title>
    <script th:src="@{/webjars/htmx.org/1.9.12/dist/htmx.min.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        function initializeReportCardStudentPanel() {
            const listPane = document.querySelector("[data-report-card-student-list-pane]");
            const detailCard = document.querySelector(".certificate-detail-card");
            const searchInput = document.querySelector("[data-report-card-student-search]");
            const items = Array.from(document.querySelectorAll("[data-report-card-student-item]"));

            if (listPane && detailCard) {
                const cardBody = listPane.closest(".card-body");
                const detailHeight = detailCard.offsetHeight;
                const consumedAboveList = cardBody ? (listPane.offsetTop - cardBody.offsetTop) : 0;
                const availableHeight = detailHeight - consumedAboveList;
                if (availableHeight > 120) {
                    listPane.style.height = `${availableHeight}px`;
                    listPane.style.maxHeight = `${availableHeight}px`;
                }
            }

            if (searchInput) {
                const applyFilter = () => {
                    const query = searchInput.value.trim().toLowerCase();
                    items.forEach((item) => {
                        const name = (item.getAttribute("data-student-name") || "").toLowerCase();
                        item.style.display = !query || name.includes(query) ? "" : "none";
                    });
                };
                searchInput.removeEventListener("input", searchInput._reportCardFilterHandler || (() => {}));
                searchInput._reportCardFilterHandler = applyFilter;
                searchInput.addEventListener("input", applyFilter);
                applyFilter();
            }
        }

        document.addEventListener("DOMContentLoaded", initializeReportCardStudentPanel);
        document.addEventListener("htmx:afterSwap", initializeReportCardStudentPanel);
        window.addEventListener("resize", initializeReportCardStudentPanel);
    </script>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Report Cards</h1>
            <p class="text-secondary mb-0">Review cumulative quarter grades by course for the selected reporting term.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/academics/certificates}">Open certificates</a>
            <a class="btn btn-outline-secondary" th:href="@{/reports}">Back to reports</a>
        </div>
    </div>

    <section id="report-card-content">
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label" for="grade">Grade</label>
                        <select class="form-select" id="grade" name="grade" form="reportCardFilters">
                            <option value="">All grades</option>
                            <option th:each="gradeOption : ${gradeOptions.entrySet()}"
                                    th:selected="${gradeOption.key == selectedGrade}"
                                    th:text="${gradeOption.value}"
                                    th:value="${gradeOption.key}">1</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="term">Report card term</label>
                        <select class="form-select" id="term" name="term" form="reportCardFilters">
                            <option th:each="termOption : ${terms}"
                                    th:selected="${termOption == selectedTerm}"
                                    th:text="${termOption}"
                                    th:value="${termOption}">Q3</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="year">Year</label>
                        <select class="form-select" id="year" name="year" form="reportCardFilters">
                            <option th:each="yearOption : ${years}"
                                    th:selected="${yearOption == selectedYear}"
                                    th:text="${yearOption}"
                                    th:value="${yearOption}">2026</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <div class="form-label">Enrollment status</div>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="reportCardEnrolledStatus" name="enrollStatus" value="0" form="reportCardFilters"
                                       th:checked="${selectedEnrollStatuses != null and #lists.contains(selectedEnrollStatuses, 0)}">
                                <label class="form-check-label" for="reportCardEnrolledStatus">Enrolled</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="reportCardInactiveStatus" name="enrollStatus" value="1" form="reportCardFilters"
                                       th:checked="${selectedEnrollStatuses != null and #lists.contains(selectedEnrollStatuses, 1)}">
                                <label class="form-check-label" for="reportCardInactiveStatus">Inactive</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="reportCardUnenrolledStatus" name="enrollStatus" value="2" form="reportCardFilters"
                                       th:checked="${selectedEnrollStatuses != null and #lists.contains(selectedEnrollStatuses, 2)}">
                                <label class="form-check-label" for="reportCardUnenrolledStatus">Unenrolled</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <form id="reportCardFilters" method="get" th:action="@{/reports/report-cards}"></form>
                        <button class="btn btn-primary" type="submit" form="reportCardFilters">Apply filters</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-xl-4">
                <div class="card border-0 shadow-sm h-100 certificate-student-panel">
                    <div class="card-body d-flex flex-column">
                        <h2 class="h5 mb-3">Students</h2>
                        <div class="mb-3">
                            <input class="form-control"
                                   type="search"
                                   placeholder="Search student name"
                                   aria-label="Search student name"
                                   data-report-card-student-search />
                        </div>
                        <div class="certificate-student-list-pane" data-report-card-student-list-pane>
                            <div class="list-group">
                                <a class="list-group-item list-group-item-action certificate-student-item text-start"
                                   th:each="student : ${students}"
                                   th:classappend="${selectedStudent != null and selectedStudent.id == student.id} ? ' active' : ''"
                                   data-report-card-student-item
                                   th:attr="data-student-name=${student.displayName()}"
                                   th:href="@{/reports/report-cards(grade=${selectedGrade},term=${selectedTerm},year=${selectedYear},studentId=${student.id},enrollStatus=${selectedEnrollStatuses})}">
                                    <div class="d-flex justify-content-between align-items-center gap-2 mb-1">
                                        <div class="fw-semibold mb-0" th:text="${student.displayName()}">Student Name</div>
                                        <span class="small text-secondary text-nowrap"
                                              th:text="'Grade ' + ${T(org.gca.schoolms.certificates.CertificateLabelUtil).displayGrade(student.gradeLevel())}">Grade 5</span>
                                    </div>
                                    <div class="small text-secondary" th:text="'Student ID ' + ${student.id()}">Student ID 1</div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-8">
                <div th:replace="${selectedStudent != null} ? ~{reports/fragments/report-card-detail :: detail} : ~{reports/fragments/report-card-detail :: empty}"></div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
