<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certificates | GCA School MS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/webjars/htmx.org/1.9.12/dist/htmx.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        function initializeCertificateStudentPanel() {
            const listPane = document.querySelector("[data-student-list-pane]");
            const detailCard = document.querySelector(".certificate-detail-card");
            const searchInput = document.querySelector("[data-student-search]");
            const items = Array.from(document.querySelectorAll("[data-student-item]"));

            if (listPane && detailCard) {
                const cardBody = listPane.closest(".card-body");
                const detailHeight = detailCard.offsetHeight;
                const consumedAboveList = cardBody ? (listPane.offsetTop - cardBody.offsetTop) : 0;
                const availableHeight = detailHeight - consumedAboveList;
                if (availableHeight > 120) {
                    listPane.style.height = `${availableHeight}px`;
                    listPane.style.maxHeight = `${availableHeight}px`;
                }
            }

            if (searchInput) {
                const applyFilter = () => {
                    const query = searchInput.value.trim().toLowerCase();
                    items.forEach((item) => {
                        const name = (item.getAttribute("data-student-name") || "").toLowerCase();
                        item.style.display = !query || name.includes(query) ? "" : "none";
                    });
                };
                searchInput.removeEventListener("input", searchInput._certificateFilterHandler || (() => {}));
                searchInput._certificateFilterHandler = applyFilter;
                searchInput.addEventListener("input", applyFilter);
                applyFilter();
            }

            items.forEach((item) => {
                item.onclick = (event) => {
                    event.preventDefault();
                    const detailUrl = item.getAttribute("data-detail-url");
                    const pageUrl = item.getAttribute("data-page-url");
                    if (!detailUrl) {
                        return;
                    }
                    document.querySelectorAll("[data-student-item]").forEach((button) => button.classList.remove("active"));
                    item.classList.add("active");
                    fetch(detailUrl, {
                        headers: {
                            "HX-Request": "true"
                        }
                    })
                        .then((response) => response.text())
                        .then((html) => {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(html, "text/html");
                            const nextPanel = doc.querySelector("#certificate-detail-panel");
                            const currentPanel = document.querySelector("#certificate-detail-panel");
                            if (!nextPanel || !currentPanel) {
                                return;
                            }
                            currentPanel.replaceWith(nextPanel);
                            initializeCertificateStudentPanel();
                        })
                        .catch(() => {
                            if (pageUrl) {
                                window.location.assign(pageUrl);
                            }
                        });
                    if (pageUrl) {
                        window.history.pushState({}, "", pageUrl);
                    }
                };
            });
        }

        document.addEventListener("DOMContentLoaded", initializeCertificateStudentPanel);
        document.addEventListener("htmx:afterSwap", initializeCertificateStudentPanel);
        window.addEventListener("resize", initializeCertificateStudentPanel);
    </script>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Certificate Generation</h1>
            <p class="text-secondary mb-0">Native LMS workspace for honor-roll certificate generation from the shared academic staging data.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/reports/report-cards}">Open report cards</a>
            <a class="btn btn-outline-secondary" th:href="${certificateGeneratorUrl}" target="_blank" rel="noopener">Open legacy tool</a>
        </div>
    </div>

    <section id="certificate-content">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-4 align-items-start">
                <div class="col-xl-8">
                    <h2 class="h5 mb-3">Student filters</h2>
                    <form class="row g-3 align-items-end"
                          method="get"
                          th:action="@{/academics/certificates}"
                          hx-get="/academics/certificates"
                          hx-target="#certificate-content"
                          hx-select="#certificate-content"
                          hx-swap="outerHTML transition:true"
                          hx-push-url="true">
                        <div class="col-md-3">
                            <label class="form-label" for="grade">Grade</label>
                            <select class="form-select" id="grade" name="grade">
                                <option value="">All grades</option>
                                <option th:each="gradeOption : ${gradeOptions.entrySet()}"
                                        th:selected="${gradeOption.key == selectedGrade}"
                                        th:text="${gradeOption.value}"
                                        th:value="${gradeOption.key}">1</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="term">Term</label>
                            <select class="form-select" id="term" name="term">
                                <option th:each="termOption : ${terms}"
                                        th:selected="${termOption == selectedTerm}"
                                        th:text="${termOption}"
                                        th:value="${termOption}">Q3</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="year">Year</label>
                            <select class="form-select" id="year" name="year">
                                <option th:each="yearOption : ${years}"
                                        th:selected="${yearOption == selectedYear}"
                                        th:text="${yearOption}"
                                        th:value="${yearOption}">2026</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <div class="form-label">Enrollment status</div>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="enrolledStatus" name="enrollStatus" value="0"
                                           th:checked="${selectedEnrollStatuses != null and #lists.contains(selectedEnrollStatuses, 0)}">
                                    <label class="form-check-label" for="enrolledStatus">Enrolled</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="inactiveStatus" name="enrollStatus" value="1"
                                           th:checked="${selectedEnrollStatuses != null and #lists.contains(selectedEnrollStatuses, 1)}">
                                    <label class="form-check-label" for="inactiveStatus">Inactive</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="unenrolledStatus" name="enrollStatus" value="2"
                                           th:checked="${selectedEnrollStatuses != null and #lists.contains(selectedEnrollStatuses, 2)}">
                                    <label class="form-check-label" for="unenrolledStatus">Unenrolled</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">Apply filters</button>
                        </div>
                    </form>
                </div>
                <div class="col-xl-4">
                    <h2 class="h5 mb-3">Batch export</h2>
                    <form method="post" th:action="@{/academics/certificates/export}">
                        <input type="hidden" name="grade" th:value="${selectedGrade}">
                        <input type="hidden" name="term" th:value="${selectedTerm}">
                        <input type="hidden" name="year" th:value="${selectedYear}">
                        <input th:each="status : ${selectedEnrollStatuses}" type="hidden" name="enrollStatus" th:value="${status}">
                        <div class="mb-3">
                            <div class="form-label">Certificate types</div>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check" th:each="certificateType : ${certificateTypes}">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="honorTypes"
                                           th:id="${'honorType' + certificateType.name()}"
                                           th:value="${certificateType.name()}"
                                           checked>
                                    <label class="form-check-label"
                                           th:for="${'honorType' + certificateType.name()}"
                                           th:text="${certificateType.displayName}">Principal's List</label>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary" type="submit">Export filtered certificates ZIP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-xl-4">
            <div class="card border-0 shadow-sm h-100 certificate-student-panel">
                <div class="card-body d-flex flex-column" data-student-panel-body>
                    <h2 class="h5 mb-3">Students</h2>
                    <div class="mb-3">
                        <input class="form-control"
                               type="search"
                               placeholder="Search student name"
                               aria-label="Search student name"
                               data-student-search />
                    </div>
                    <div class="certificate-student-list-pane" data-student-list-pane>
                    <div class="list-group">
                        <button class="list-group-item list-group-item-action certificate-student-item text-start"
                                type="button"
                                th:each="student : ${students}"
                                th:classappend="${selectedStudent != null and selectedStudent.id == student.id} ? ' active' : ''"
                                data-student-item
                                th:attr="data-student-name=${student.displayName()},data-detail-url=@{/academics/certificates/detail(studentId=${student.id},term=${selectedTerm},year=${selectedYear})},data-page-url=@{/academics/certificates(grade=${selectedGrade},term=${selectedTerm},year=${selectedYear},studentId=${student.id},enrollStatus=${selectedEnrollStatuses})}">
                            <div class="d-flex justify-content-between align-items-center gap-2 mb-1">
                                <div class="fw-semibold mb-0" th:text="${student.displayName()}">Student Name</div>
                                <span class="small text-secondary text-nowrap"
                                      th:text="'Grade ' + ${T(org.gca.schoolms.certificates.CertificateLabelUtil).displayGrade(student.gradeLevel())}">Grade 12</span>
                            </div>
                            <div class="small">
                                <span class="badge"
                                      th:with="studentHonor=${honorResultsByStudentId[student.id]}"
                                      th:classappend="${studentHonor != null and studentHonor.name() != 'NONE'} ? ' text-bg-success' : ' text-bg-light border text-dark'"
                                      th:text="${studentHonor != null ? studentHonor.displayName : 'No certificate'}">A Honor Roll</span>
                            </div>
                        </button>
                    </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-8">
            <div th:replace="${selectedStudent != null} ? ~{academics/fragments/certificate-detail :: detail} : ~{academics/fragments/certificate-detail :: empty}"></div>
        </div>
    </div>
    </section>
</main>
</body>
</html>
