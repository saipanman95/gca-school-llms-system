<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fee Maintenance | GCA School MS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h1 class="h3 mb-1">Fee Maintenance</h1>
            <p class="text-secondary mb-0">Maintain fee definitions, yearly limits, and school project gift categories.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/finance}">Back to finance center</a>
    </div>
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3" th:text="${feeTypeForm.id != null ? 'Edit fee type' : 'Add fee type'}">Add fee type</h2>
                    <form method="post" th:action="@{/finance/fee-types}" th:object="${feeTypeForm}">
                        <input th:field="*{id}" type="hidden">
                        <div class="mb-3">
                            <label class="form-label" for="feeTypeCode">Code</label>
                            <input class="form-control" id="feeTypeCode" placeholder="ENROLLMENT_FEE" required th:field="*{code}" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="feeTypeName">Name / description</label>
                            <input class="form-control" id="feeTypeName" placeholder="Enrollment fee" required th:field="*{name}" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="feeTypeDefaultAmount">Default amount</label>
                            <input class="form-control" id="feeTypeDefaultAmount" min="0.00" placeholder="300.00" step="0.01" th:field="*{defaultAmount}" type="number">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="feeTypeMaxAssessmentsPerStudentPerSchoolYear">Max assessments per student per school year</label>
                            <input class="form-control" id="feeTypeMaxAssessmentsPerStudentPerSchoolYear" min="1" placeholder="Leave blank for no limit" th:field="*{maxAssessmentsPerStudentPerSchoolYear}" type="number">
                        </div>
                        <div class="mb-3 form-check">
                            <input class="form-check-input" id="feeTypeActive" th:field="*{active}" type="checkbox">
                            <label class="form-check-label" for="feeTypeActive">Active</label>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" th:text="${feeTypeForm.id != null ? 'Update fee type' : 'Add fee type'}" type="submit">Add fee type</button>
                            <a class="btn btn-outline-secondary" th:if="${feeTypeForm.id != null}" th:href="@{/finance/fees}">Cancel</a>
                        </div>
                    </form>
                    <hr>
                    <div class="small text-secondary mb-2">Current fee types</div>
                    <div class="d-flex flex-wrap gap-2">
                        <a class="badge text-bg-light border text-decoration-none"
                           th:each="feeType : ${feeTypes}"
                           th:href="@{/finance/fees(editFeeTypeId=${feeType.id})}"
                           th:text="${feeType.name
                               + (feeType.defaultAmount != null ? ' (' + @moneyFormatter.format(feeType.defaultAmount) + ')' : '')
                               + (feeType.maxAssessmentsPerStudentPerSchoolYear != null ? ' • max ' + feeType.maxAssessmentsPerStudentPerSchoolYear + '/year' : '')
                               + (!feeType.active ? ' • inactive' : '')}">Enrollment fee</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Add school project type</h2>
                    <form method="post" th:action="@{/finance/school-project-types}">
                        <div class="mb-3">
                            <label class="form-label" for="projectTypeCode">Code</label>
                            <input class="form-control" id="projectTypeCode" name="code" placeholder="SENIOR_TRIP" required type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="projectTypeName">Name</label>
                            <input class="form-control" id="projectTypeName" name="name" placeholder="Senior Trip" required type="text">
                        </div>
                        <button class="btn btn-outline-primary" type="submit">Add project type</button>
                    </form>
                    <hr>
                    <div class="small text-secondary mb-2">Current school project types</div>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge text-bg-light border" th:each="projectType : ${schoolProjectTypes}" th:text="${projectType.name}">General</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
